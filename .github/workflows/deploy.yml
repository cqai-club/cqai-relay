name: Deploy to shujubang

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shujubang-production
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Package source
        run: tar --exclude=.git -czf /tmp/cqai-relay.tgz .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cqai-relay-source
          path: /tmp/cqai-relay.tgz
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cqai-relay-source

      - name: Check DEPLOY_HOST
        env:
          VALUE: ${{ secrets.DEPLOY_HOST }}
        run: test -n "$VALUE"

      - name: Check DEPLOY_USER
        env:
          VALUE: ${{ secrets.DEPLOY_USER }}
        run: test -n "$VALUE"

      - name: Check DEPLOY_SSH_KEY
        env:
          VALUE: ${{ secrets.DEPLOY_SSH_KEY }}
        run: test -n "$VALUE"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Upload source
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          set -eu
          scp -P "$DEPLOY_PORT" cqai-relay.tgz "$DEPLOY_USER@$DEPLOY_HOST:/data/cqai-relay/incoming.tgz"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          set -eu
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -eu
          APP_DIR=/data/cqai-relay
          cd "$APP_DIR"
          tar -xzf incoming.tgz
          rm -f incoming.tgz
          test -f .env
          docker compose --env-file .env -f docker-compose.deploy.yml up -d --build --remove-orphans
          docker compose --env-file .env -f docker-compose.deploy.yml ps
          APP_PORT=$(sed -n 's/^APP_PORT=//p' .env | tail -1)
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${APP_PORT:-3002}/api/status" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs --tail 100 cqai-relay
          exit 1
          REMOTE
