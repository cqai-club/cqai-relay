name: Deploy to shujubang

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: shujubang-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Upload source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "."
          target: /data/cqai-relay
          overwrite: true
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            APP_DIR=/data/cqai-relay
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            test -f .env
            docker compose --env-file .env -f docker-compose.deploy.yml up -d --build --remove-orphans
            docker compose --env-file .env -f docker-compose.deploy.yml ps
            curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:${APP_PORT:-3002}/api/status >/dev/null
