services:
  new-api:
    # Production images are built by GitHub Actions and pulled from GHCR.
    # IMAGE_TAG is normally an immutable sha-* tag supplied by the deploy job.
    image: ${IMAGE_REPOSITORY:-ghcr.io/cqai-club/cqai-relay}:${IMAGE_TAG:-latest}
    container_name: cqai-relay
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "${APP_PORT:-3002}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: postgresql://root:${POSTGRES_PASSWORD}@postgres:5432/new-api
      REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: ${NODE_NAME:-cqai-relay}
      SESSION_SECRET: ${SESSION_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      NEW_API_INTERNAL_TOKEN: ${NEW_API_INTERNAL_TOKEN}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Kept for Relay's native/compatibility payment entry points. Account
      # Service internal payment requests use their own client redirect map.
      TRUSTED_REDIRECT_DOMAINS: ${TRUSTED_REDIRECT_DOMAINS:-}
      TRUSTED_PAYMENT_REDIRECT_URIS: ${TRUSTED_PAYMENT_REDIRECT_URIS:-}
      # Leave blank by default so the application uses its safe compatibility
      # defaults for loopback and private reverse-proxy networks. Set an
      # explicit list when the deployment topology is known.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cqai-relay

  postgres:
    image: postgres:15-alpine
    container_name: cqai-relay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: new-api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cqai-relay

  redis:
    image: redis:7-alpine
    container_name: cqai-relay-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cqai-relay

volumes:
  postgres_data:

networks:
  cqai-relay:
